<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Study Screen</title>
        <link href="style.css" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    </head>

    <body>

        <div class="icon-bar">
            <button onclick="openApp('todo')">
                <i class="material-icons" style="font-size:35px">checklist</i>
            </button>
            <button onclick="openApp('timer')">
                <span class="material-icons" style="font-size:35px">timer</span>
            </button>
            <button onclick="openApp('notes')">
                <span class="material-icons" style="font-size:35px">notes</span>
            </button>
            <button onclick="openApp('ambient-sounds')">
                <span class="material-icons" style="font-size:35px">headphones</span>
            </button>
            
        </div>

        <div class="workspace">
            <div id="todo" class="app-window">
                <div class="window-header">
                    <span>Todo List</span>
                    <button class="close-btn" onclick="closeApp('todo')">x</button>
                </div>
                <div class="window-content">
                    <input type="text" id="todoInput" placeholder="New Todo...">
                    <span onclick="addTodo()" class="addBtn">+</span>

                    <ul id="todoList"></ul>
                </div>
            </div>
            
            <div id="timer" class="app-window">
                <div class="window-header">
                    <span>Timer</span>
                    <button class="close-btn" onclick="closeApp('timer')">x</button>
                </div>
                <div class="window-content">
                    <div id="timerDisplay">00:00</div>
                    <div class="timer-input-group">
                        <input type="number" id="timerInput" placeholder="Min" min="1" max="99">
                        <span>Minutes</span>
                    </div>
                    <div class="timer-controlls">
                        <button id="startBtn" onclick="startTimer()" class="material-icons" style="font-size: 15px;">play_arrow</button>
                        <button onclick="pauseTimer()" class="material-icons" style="font-size: 15px;">pause</button>
                        <button onclick="resetTimer()" class="material-icons" style="font-size: 15px;">replay</button>
                    </div>
                </div>
            </div>

            <div id="notes" class="app-window">
                <div class="window-header">
                    <span>Notes</span>
                    <button class="close-btn"onclick="closeApp('notes')">x</button>
                </div>
                <div class="window-content">
                    <textarea id="notesInput" placeholder="Write your notes here..." oninput="saveNotes()"></textarea>
                </div>
            </div>

            <div id="ambient-sounds" class="app-window">
                <div class="window-header">
                    <span>Ambient Sounds</span>
                    <button class="close-btn" onclick="closeApp('ambient-sounds')">x</button>
                </div>
                <div class="window-content">
                    <div class="sound-option">
                        <span>Rain</span>
                        <input type="range" id="rainVolume" min="0" max="1" step="0.01" value="0" onchange="setVolume('rain', this.value)">
                    </div>
                    <div class="sound-option">
                        <span>Forest</span>
                        <input type="range" id="forestVolume" min="0" max="1" step="0.01" value="0" onchange="setVolume('forest', this.value)">
                    </div>
                    <div class="sound-option">
                        <span>Ocean</span>
                        <input type="range" id="oceanVolume" min="0" max="1" step="0.01" value="0" onchange="setVolume('ocean', this.value)">
                    </div>
                </div>
            </div>

        </div>


        <div id="datetime">
            <div id="time" ">00:00</div>
            <div id="date">weekday, 00/00</div>
        </div>
        
        <script src="script.js"> </script>
    </body>
</html>
