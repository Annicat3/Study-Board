<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Study Screen</title>
        <link href="style.css" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    </head>

    <body>

        <div class="icon-bar">
            <button onclick="openApp('todo')">
                <i class="material-icons" style="font-size:35px">checklist</i>
            </button>
            <button onclick="openApp('timer')">
                <span class="material-icons" style="font-size:35px">timer</span>
            </button>
            <button onclick="openApp('notes')">
                <span class="material-icons" style="font-size:35px">notes</span>
            </button>
            
        </div>

        <div class="workspace">
            <div id="todo" class="app-window">
                <div class="window-header">
                    <span>Todo List</span>
                    <button class="close-btn" onclick="closeApp('todo')">x</button>
                </div>
                <div class="window-content">
                    <input type="text" id="todoInput" placeholder="New Todo...">
                    <span onclick="addTodo()" class="addBtn">+</span>

                    <ul id="todoList"></ul>
                </div>
            </div>
            
            <div id="timer" class="app-window">
                <div class="window-header">
                    <span>Timer</span>
                    <button class="close-btn" onclick="closeApp('timer')">x</button>
                </div>
                <div class="window-content">
                    <p> -Timer- </p>
                </div>
            </div>

            <div id="notes" class="app-window">
                <div class="window-header">
                    <span>Notes</span>
                    <button class="close-btn"onclick="closeApp('notes')">x</button>
                </div>
                <div class="window-content">
                    <p>Notes</p>
                </div>
            </div>

        </div>


        <div id="datetime">
            <div id="time" style="font-size:30px">00:00</div>
            <div id="date">weekday, 00/00</div>
        </div>
        
        <script src="script.js"> </script>
    </body>
</html>
