<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Study Board</title>
        <link href="style.css" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    </head>

    <body>

        <div class="video-background">
            <iframe 
               id="bgVideo" 
               frameborder="0" 
               allow="autoplay; encrypted-media"
               referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>
        </div>

        <div class="icon-bar">
            <button onclick="openApp('todo')">
                <i class="material-icons" style="font-size:35px">checklist</i>
            </button>
            <button onclick="openApp('timer')">
                <span class="material-icons" style="font-size:35px">timer</span>
            </button>
            <button onclick="openApp('notes')">
                <span class="material-icons" style="font-size:35px">notes</span>
            </button>
            <button onclick="openApp('ambient-sounds')">
                <span class="material-icons" style="font-size:35px">headphones</span>
            </button>
            <button onclick="openApp('settings')">
                <span class="material-icons" style="font-size: 35px;">settings</span>
            </button>
            
        </div>

        <div class="workspace">
            <div id="todo" class="app-window">
                <div class="window-header">
                    <span>Todo List</span>
                    <button class="close-btn" onclick="closeApp('todo')">x</button>
                </div>
                <div class="window-content">
                    <input type="text" id="todoInput" placeholder="New Todo...">
                    <span onclick="addTodo()" class="addBtn">+</span>

                    <ul id="todoList"></ul>
                </div>
            </div>
        
            <div id="timer" class="app-window">
                <div class="window-header">
                    <span>Timer</span>
                    <button class="close-btn" onclick="closeApp('timer')">x</button>
                </div>
                <div class="window-content">
                    <div id="timerDisplay">00:00</div>
                    <div class="timer-input-group">
                        <input type="number" id="timerInput" placeholder="Min" min="1" max="99">
                        <span>Minutes</span>
                    </div>
                    <div class="timer-controlls">
                        <button id="startBtn" onclick="startTimer()" class="material-icons" style="font-size: 15px;">play_arrow</button>
                        <button onclick="pauseTimer()" class="material-icons" style="font-size: 15px;">pause</button>
                        <button onclick="resetTimer()" class="material-icons" style="font-size: 15px;">replay</button>
                    </div>
                </div>
                <audio id="alarm" src="audio/funny-alarm.mp3"></audio>
            </div>

            <div id="notes" class="app-window">
                <div class="window-header">
                    <span>Notes</span>
                    <button class="close-btn"onclick="closeApp('notes')">x</button>
                </div>
                <div class="window-content">
                    <textarea id="notesInput" placeholder="Write your notes here..." oninput="saveNotes()"></textarea>
                </div>
            </div>

            <div id="ambient-sounds" class="app-window">
                <div class="window-header">
                    <span>Ambient Sounds</span>
                    <button class="close-btn" onclick="closeApp('ambient-sounds')">x</button>
                </div>
                <div class="window-content">
                    <div class="sound-option">
                        <span>Forest</span>
                        <input type="range" id="forestVolume" min="0" max="1" step="0.01" value="0" oninput="adjustVolume('forest', this.value)">
                    </div>
                    <audio id="forest" src="audio/forest.mp3" loop></audio>
                    <div class="sound-option">
                        <span>Rain</span>
                        <input type="range" id="rainVolume" min="0" max="1" step="0.01" value="0" oninput="adjustVolume('rain', this.value)">
                    </div>
                    <audio id="rain" src="audio/rain.mp3" loop></audio>
                    <div class="sound-option">
                        <span>Ocean</span>
                        <input type="range" id="oceanVolume" min="0" max="1" step="0.01" value="0" oninput="adjustVolume('ocean', this.value)">
                    </div>
                    <audio id="ocean" src="audio/ocean.mp3" loop></audio>
                    <div class="sound-option">
                        <span>River</span>
                        <input type="range" id="riverVolume" min="0" max="1" step="0.01" value="0" oninput="adjustVolume('river', this.value)">
                    </div>
                    <audio id="river" src="audio/river.mp3" loop></audio>
                    <div class="sound-option">
                        <span>Campfire</span>
                        <input type="range" id="campfireVolume" min="0" max="1" step="0.01" value="0" oninput="adjustVolume('fire', this.value)">
                    </div>
                    <audio id="fire" src="audio/fire.mp3" loop></audio>
                    <div class="sound-option">
                        <span>Cat purr</span>
                        <input type="range" id="catpurrVolume" min="0" max="1" step="0.01" value="0" oninput="adjustVolume('catpurr', this.value)">
                    </div>
                    <audio id="catpurr" src="audio/cat-purr.mp3" loop></audio>
                </div>
            </div>

            <div id="settings" class="app-window fullscreen-window">
                <div class="window-header">
                    <span>Settings</span>
                    <button class="close-btn" onclick="closeApp('settings')">x</button>
                </div>
                <div class="window-content">
                    <h3>Accent Color</h3>
                    <div class="color-options">
                        <button class="color-btn" style="background: #ec3750" onclick="changeAccentColor('#ec3750')"></button>
                        <button class="color-btn" style="background: #ff8c37" onclick="changeAccentColor('#ff8c37')"></button>
                        <button class="color-btn" style="background: #f1c40f" onclick="changeAccentColor('#f1c40f')"></button>
                        <button class="color-btn" style="background: #33d6a6" onclick="changeAccentColor('#33d6a6')"></button>
                        <button class="color-btn" style="background: #5bc0de" onclick="changeAccentColor('#5bc0de')"></button>
                        <button class="color-btn" style="background: #338eda" onclick="changeAccentColor('#338eda')"></button>
                        <button class="color-btn" style="background: #a633d6" onclick="changeAccentColor('#a633d6')"></button>
                        <button class="color-btn" style="background: #8492a6" onclick="changeAccentColor('#8492a6')"></button>
                        <input type="color" id="colorPicker" onchange="changeAccentColor(this.value)">
                    </div>

                    <h3>Youtube Background</h3>
                    <div class="yt-settings">
                        <input type="text" id="ytInput" placeholder="Insert YouTube link...">
                        <button onclick="applyYtBg()">Apply</button>
                    </div>

                </div>
            </div>

        </div>


        <div id="datetime">
            <div id="time">00:00</div>
            <div id="date">weekday, 00/00</div>
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
